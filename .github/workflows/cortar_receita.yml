name: Cortar receita

# Roda o corte INTEIRO na nuvem, com a voz clonada. A maquina do Bryan e'
# limitada e nao instala torch/chatterbox (o spacy-pkuseg nao compila no
# Python 3.14 dela); aqui o runner e' 3.12, onde as rodas existem.
#
# A amostra de voz NAO vive neste repositorio: ele e' publico. Ela mora num
# repo PRIVADO e o runner baixa com VOZ_TOKEN, so' durante a execucao.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link do YouTube"
        required: true
      qtd:
        description: "Quantos cortes"
        required: false
        default: "2"
      idioma:
        description: "Idioma da fala na fonte (en, it, fr, ja)"
        required: false
        default: "en"

jobs:
  cortar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libglib2.0-0t64
          # libGLESv2.so.2 — o mediapipe precisa dela e ela NAO vem
          # com libegl1/libgl1. Sem isto o face tracking cai pro crop
          # fixo no centro. Comando separado porque o nome do pacote
          # muda entre versoes do Ubuntu; falhar aqui nao pode
          # derrubar o run inteiro.
          sudo apt-get install -y libgles2 || sudo apt-get install -y libgles2-mesa || true

      - run: pip install -r requirements.txt

      # O YouTube recusa os IPs do Actions: "Sign in to confirm you're not a
      # bot". Estas tres defesas vinham do workflow do outro canal e eu as
      # apaguei ao enxugar — o run #1 morreu exatamente aqui.
      - run: pip install -U yt-dlp-invidious

      - name: Provedor de PO token (bgutil)
        continue-on-error: true
        run: |
          pip install -U bgutil-ytdlp-pot-provider
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil"
          cd "$RUNNER_TEMP/bgutil/server"
          npm ci
          npx tsc
          echo "YTDLP_POT_SERVER=$RUNNER_TEMP/bgutil/server" >> "$GITHUB_ENV"

      - name: Cookies do YouTube (se o secret existir)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies gravados"
          else
            echo "::warning::sem YTDLP_COOKIES — dependendo so' do Invidious e do PO token"
          fi

      # Voz clonada em passo separado e TOLERANTE: se o chatterbox nao
      # instalar, o job segue e cai no edge-tts, em vez de morrer depois de
      # ja' ter gasto Gemini e Groq na selecao e na traducao.
      - name: Instalar voz clonada (Chatterbox)
        id: voz
        continue-on-error: true
        run: pip install chatterbox-tts perth torchaudio

      - name: Baixar a amostra de voz do repo privado
        if: steps.voz.outcome == 'success'
        env:
          VOZ_TOKEN: ${{ secrets.VOZ_TOKEN }}
        run: |
          mkdir -p vozes
          curl -sfL -H "Authorization: Bearer $VOZ_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -o vozes/bryan_amostra.wav \
            https://api.github.com/repos/${{ github.repository_owner }}/voz/contents/amostra.wav
          ls -la vozes/

      - name: Desligar voz clonada se ela nao instalou
        if: steps.voz.outcome != 'success'
        run: |
          echo "::warning::chatterbox nao instalou — saindo com edge-tts (voz PROVISORIA)"
      # O chatterbox rebaixa o numpy pra 1.26 e o opencv 5 exige >=2. Descobrir
      # isso na hora do render jogaria fora o Gemini e o Groq ja gastos.
      - name: Conferir que o motor importa (falha barata antes de gastar API)
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import cv2; print('cv2', cv2.__version__)"
          python -c "import mediapipe, PIL, num2words; print('render ok')"

      - name: Cortar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GEMINI_API_KEY_21: ${{ secrets.GEMINI_API_KEY_21 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ_API_KEY_6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ_API_KEY_7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ_API_KEY_8 }}
        run: >
          python -X utf8 main.py
          --url "${{ inputs.url }}"
          --qtd "${{ inputs.qtd }}"
          --idioma "${{ inputs.idioma }}"
          --dublar --fala-literal

      - name: Guardar os clipes
        uses: actions/upload-artifact@v4
        with:
          name: cortes
          path: saida/**
          retention-days: 30

      - name: Mandar pros rascunhos do Buffer
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository_owner }}/media-assets
        run: |
          find saida -name 'short_9x16.mp4' -print0 | while IFS= read -r -d '' v; do
            python -X utf8 previa_buffer.py "$v" --titulo "$(basename "$(dirname "$v")")"
          done

      - name: Avisar no Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then T="Corte de receita pronto — ja esta nos rascunhos do Buffer."
          else T="Corte de receita FALHOU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode text="$T"
