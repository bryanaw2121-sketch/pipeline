name: Cortar vídeo e subir pro Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link do YouTube do vídeo a cortar"
        required: true
      qtd:
        description: "Quantidade de clipes"
        required: false
        default: "8"
      idioma:
        description: "Idioma da fala (pt, en, es...)"
        required: false
        default: "pt"
      pasta_drive:
        description: "ID da pasta pai do Drive (com as subpastas 7/8/9)"
        required: true

jobs:
  cortar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Instalar fallback pro Invidious — tentativa gratuita 2
        run: pip install -U yt-dlp-invidious

      - name: Instalar provedor de PO Token (bgutil) — tentativa gratuita
        continue-on-error: true
        run: |
          pip install -U bgutil-ytdlp-pot-provider
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil"
          cd "$RUNNER_TEMP/bgutil/server"
          npm ci
          npx tsc
          echo "YTDLP_POT_SERVER=$RUNNER_TEMP/bgutil/server" >> "$GITHUB_ENV"

      - name: Gravar cookies do YouTube (secret -> arquivo, só pra essa execução)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Cortar
        env:
          # nomes dos secrets ficaram diferentes do padrão do código
          # (GEMINI4..GEMINI15, GROQ1..GROQ8) — mapeando aqui em vez de
          # pedir pra recriar tudo no GitHub.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI7 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI15 }}
          GROQ_API_KEY: ${{ secrets.GROQ1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ5 }}
          GROQ_API_KEY_6: ${{ secrets.GROQ6 }}
          GROQ_API_KEY_7: ${{ secrets.GROQ7 }}
          GROQ_API_KEY_8: ${{ secrets.GROQ8 }}
        run: >
          python -X utf8 main.py
          --url "${{ inputs.url }}"
          --qtd "${{ inputs.qtd }}"
          --idioma "${{ inputs.idioma }}"

      - name: Subir pro Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -X utf8 subir_drive.py --pasta-id "${{ inputs.pasta_drive }}"

      - name: Avisar no Telegram (roda sempre, mesmo se algo falhar acima)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TEXTO="✅ Corte terminou: ${{ inputs.url }} — já está no Drive."
          else
            TEXTO="⚠️ Corte falhou: ${{ inputs.url }} — confira o log em ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$TEXTO"
